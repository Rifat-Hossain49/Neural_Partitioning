name: artifact-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Run the capsule's Reproducible Run
        run: bash code/run
      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-run-results
          path: results/

  capsule:
    # Builds the Code Ocean environment (environment/Dockerfile) and runs code/run
    # with /code, /data, and /results mounted as in a Code Ocean Reproducible Run.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the capsule environment
        run: docker build -t waharp-capsule environment
      - name: Reproducible Run in the capsule environment
        run: |
          mkdir -p results
          docker run --rm -v "$PWD/code:/code" -v "$PWD/data:/data:ro" \
            -v "$PWD/results:/results" -w /code waharp-capsule bash run
      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-run-results
          path: results/
